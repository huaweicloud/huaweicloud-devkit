name: CI

on:
  pull_request:
    branches: [main, dev, next, v2]
  push:
    branches: [dev, v2]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: duplication gate (new clones vs committed baseline)
        run: npm run lint:dup -- --reporters silent --baseline .jscpd-baseline.json --fail-on-new-clones 0 --fail-on-empty

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Proves the documented development floor. The test matrix uses '22', which
  # resolves to the newest 22.x and never exercises the pinned minimum.
  floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate

  # OS coverage: Linux x64/arm + Windows. macOS is deliberately absent: the
  # PTY-driven interactive install tests require util-linux `script` syntax
  # (they skip off-Linux via the ptySkip guard), and no maintainer verifies
  # on macOS today. Adding a macOS leg means porting the PTY helper
  # (runAutoPty in test/agent-install.test.ts) to BSD script syntax first.
  test:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # skills/ and dist/ are gitignored build artifacts on this bloodline —
      # the test suite (structure.test.ts) and validate both read the
      # generated tree, so build first (the floor job models this shape).
      - run: npm run build
      - run: npm test
        env:
          # Removable stopgap for the Windows py-hook stdin decode: the
          # hook-parity tests' non-ASCII adversarial rows meet a windows
          # python that reads piped stdin as cp1252 and misreads the UTF-8
          # bytes (reproduced on Linux via PYTHONIOENCODING=cp1252 with
          # the exact CI failure signatures). UTF-8 mode fixes the child
          # decode on Windows and is a no-op on Linux. Precedence caveat:
          # an explicit PYTHONIOENCODING (no runner image ships one today)
          # overrides this — the production-hook stdin reconfigure is the
          # deferred follow-up either way.
          PYTHONUTF8: '1'
      - run: npm run validate

  integration:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/agent-install.test.ts test/cross-platform-*.test.ts

  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node ./scripts/pack-verify.mjs

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Blocking gate: production dependencies only (what ships to
      # consumers). Dev-only advisories cannot reach users of this package;
      # the full audit below keeps them visible without blocking PRs.
      - name: npm audit (production dependencies)
        run: npm audit --audit-level=high --omit=dev
      - name: npm audit (all dependencies, informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: gitleaks secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --verbose
