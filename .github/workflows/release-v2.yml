name: Release v2

# v2-only prerelease pipeline (2.0.0-next.N). Dispatch-driven by design —
# never fires on push; the human rhythm is documented in docs/RELEASING.md
# "Phase 4": dispatch #1 opens the release PR, a maintainer merges it,
# dispatch #2 tags the merged prerelease, then Publish npm is dispatched
# from the tag. The stable-looking 2.0.0 parked on package.json can never
# be tagged here: the tag step is prerelease-only until the 2.0.0 stable
# flow is designed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: Release-v2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag prerelease
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) ;;
            *)
              echo "Version ${VERSION} is stable; the v2 line tags prereleases only. Skipping."
              exit 0
              ;;
          esac
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "Created tag v${VERSION}"
          fi

      - name: Compute next version
        id: bump
        run: |
          VERSION=$(node ./scripts/bump-version.mjs v2)
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Next version: $VERSION"
          else
            echo "Skipping (already released or no new commits)."
          fi

      - name: Create release PR
        if: ${{ steps.bump.outputs.version != '' }}
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node ./scripts/create-release-pr.mjs "${{ steps.bump.outputs.version }}" "v2"
