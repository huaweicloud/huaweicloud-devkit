name: Publish npm

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: Publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 'Gate: must run from a v* tag matching package.json'
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::Publish must run from a v* tag, not a branch."; exit 1; }
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) echo "::error::Tag must start with v (got $GITHUB_REF_NAME)."; exit 1 ;;
          esac
          VERSION=$(node -p "require('./package.json').version")
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION."; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: node ./scripts/pack-verify.mjs

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: 'Guard: version must not exist on the registry'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "huaweicloud-devkit@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$VERSION already exists on npm; nothing to publish."
            exit 1
          fi
      - name: Publish tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public --tag latest ;;
          esac

  publish-clawhub:
    name: Publish to ClawHub
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: clawhub-publish
    if: ${{ vars.CLAWHUB_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install clawhub CLI
        run: npm install -g clawhub
      - name: Login to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: clawhub login --token "$CLAWHUB_TOKEN"
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bash scripts/clawhub-publish.sh "$VERSION"
