name: e2e-nightly

# Agent-level E2E suite (test/e2e/): a real agent run with a real LLM drives
# the tarball-installed devkit against the fake Huawei Cloud boundary, as a
# two-driver matrix (opencode and codex legs, E2E_AGENT-keyed). Real-LLM cost
# and latency keep it out of npm test and out of the REQUIRED PR gate; the
# trigger lanes below are accepted-cost exceptions, not required checks.
#
# Lanes (this file must stay byte-identical on main and v2 — the
# drift-guard step fails the run on skew once both copies exist; a
# missing main copy is the bootstrap window: it warns and passes):
#   - nightly cron: schedule events only fire from the default branch,
#     so main's registered copy owns the cron and checks out v2 — the
#     suite's bloodline (main itself carries no test/e2e).
#   - push to v2: full matrix on every direct push (accepted LLM cost).
#   - PR into v2, same-repo only: opt-in via the `run-e2e` label; commits
#     pushed to a labeled PR (synchronize) re-run it automatically. Fork
#     PRs skip — they cannot see E2E_TEST_MODEL_APIKEY.
#   - workflow_dispatch: always tests v2 (operator intent = the nightly).
#
# The only required repository setting is the secret E2E_TEST_MODEL_APIKEY
# (a dedicated E2E key, never a personal auth file); provider/model/baseURL
# default to the committed values (an OpenAI-compatible gateway that serves
# BOTH wire shapes the legs need: chat for opencode, responses for codex —
# codex 0.162.1 removed the chat wire, measured) and stay overridable via
# the E2E_TEST_PROVIDER_ID / E2E_TEST_PROVIDER_BASEURL / E2E_TEST_MODEL
# vars. A provider swap must keep the responses route or the codex leg
# fails at its first model call.
#
# The opencode/codex pins are shared between this file's two install
# sites (the e2e matrix step and the real-agents job) — an upgrade is a
# two-place event within this file.
#
# End of life: 'v2' is hardcoded below. When v2 retires (merged and
# deleted), the trunk checkout fails loud — retarget it in the same
# change that deletes the branch, on BOTH copies.

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  push:
    branches: [v2]
  pull_request:
    types: [labeled, synchronize]
    branches: [v2]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      # A red leg must not cancel its sibling: the surviving report is the
      # nightly's triage input.
      fail-fast: false
      matrix:
        # hermes is nightly/dispatch-only (staged rollout, accepted LLM
        # cost): the push-to-v2 and run-e2e label lanes stay two-legged —
        # the step-level gates below (matrix context IS allowed at step
        # level) are what excludes it there; the leg's no-cost steps
        # (checkout, toolchain, npm ci, drift guard) still run and the
        # driver guard even exercises the hermes tests for free (the
        # prepare-path one self-skips without the pinned install).
        agent: [opencode, codex, hermes]
    runs-on: ubuntu-24.04
    # Job-level on purpose (matrix-free — GitHub rejects the matrix
    # context in a job-level if, which is what silently killed this whole
    # workflow's loading from the hermes commit until the guard step move):
    # a run whose `if` is false (any other label, an unlabeled synchronize)
    # must never join the group — workflow-level cancel-in-progress would
    # cancel the in-flight suite before the job `if` is evaluated. The
    # hermes leg's nightly/dispatch-only staging rides the step-level
    # E2E_STAGED gate expression instead (matrix IS allowed there). Trunk
    # lanes (push/schedule/dispatch) serialize per agent leg, newest wins;
    # each PR lane is independent per leg.
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action == 'synchronize' || github.event.label.name == 'run-e2e') &&
      contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      # Event-discriminated trunk groups: a push-lane leg (the staged
      # hermes one is a green idle job there) must never cancel an
      # in-flight schedule/dispatch suite of the same agent — the idle
      # leg would evict the only real budget venue and replace it with
      # zero coverage. Same-event runs still serialize, newest wins.
      group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}-{1}', github.event.pull_request.number, matrix.agent) || format('e2e-trunk-{0}-{1}', github.event_name, matrix.agent) }}
      cancel-in-progress: true
    # Per leg: 33 cases for opencode, 31 cases plus 2 recorded skips for
    # codex (the installPacks channel has no codex write path), 33 cases
    # for hermes (installPacks rides writeHermesMcpConfig), attempts
    # cap 2, per-attempt budget caps sum to 155 min single-pass / 310 min
    # worst case for opencode (147/294 for codex), plus the vendor
    # challenge's one extra model turn per case-session (worst-case
    # ~= +20 min), npm ci + npm pack + install, and per-attempt
    # install/teardown cycles. The codex leg carries its own per-turn
    # overhead (~18.6k base tokens per model turn); the hermes leg pays a
    # ~15s gateway boot and a ~12s dependency-template copy per attempt
    # (66 attempts ≈ +30 min bounded overhead) plus its install step's
    # clone+venv (network-bound, once per run).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Trunk lanes (schedule/dispatch) test v2 — the suite's bloodline;
          # push and PR lanes test the ref that triggered them.
          ref: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || 'v2' }}
      - name: Drift guard (main and v2 copies must stay identical)
        run: |
          git fetch --depth=1 origin main
          if ! git cat-file -e 'origin/main:.github/workflows/e2e-nightly.yml' 2>/dev/null; then
            echo "::warning::main has no e2e-nightly.yml yet (bootstrap window) — land the identical file on main to register the nightly cron. Drift checking is strict once both copies exist."
            exit 0
          fi
          if ! git diff --quiet origin/main -- .github/workflows/e2e-nightly.yml; then
            echo "::error::e2e-nightly.yml differs between this ref and main. Workflow changes must land on BOTH branches (main first, then v2): cron/dispatch read main's copy; push/PR read the pushed ref's copy."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Preflight E2E configuration
        # The staged gate (hermes: nightly/dispatch only) — preflight must
        # not red an idle hermes leg on push lanes over a missing secret.
        if: matrix.agent != 'hermes' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          E2E_APIKEY: ${{ secrets.E2E_TEST_MODEL_APIKEY }}
          E2E_PROVIDER_ID: ${{ vars.E2E_TEST_PROVIDER_ID || 'opengw' }}
          E2E_PROVIDER_BASEURL: ${{ vars.E2E_TEST_PROVIDER_BASEURL || 'https://opengw.clouddeveloper.club/v1' }}
          E2E_MODEL: ${{ vars.E2E_TEST_MODEL || 'glm-5.2' }}
        run: |
          if [ -z "$E2E_APIKEY" ]; then
            echo "::error::E2E config incomplete — set secret E2E_TEST_MODEL_APIKEY (the only required setting; provider/model/baseURL default to the committed values)"
            exit 1
          fi
          echo "E2E configuration present (provider: $E2E_PROVIDER_ID, model: $E2E_MODEL)"
      - name: Install agent CLI (pinned)
        # Staged gate: on push/PR lanes the hermes leg skips the install
        # (no curl|bash, no venv) and stays an idle green job.
        if: matrix.agent != 'hermes' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # Per-leg install: a registry failure on one leg's package must not take
        # the other leg's report down with it. The opencode/codex pins are
        # shared with the real-agents job below — an upgrade is a two-place
        # event within this file. The hermes pin is E2E-only (the real-agents
        # job installs opencode/codex, never hermes): the exact
        # stable commit the driver was spike-validated against; an upgrade
        # is an explicit suite event (docs/e2e-testing-design.md, "The
        # hermes driver"). The install prepares the machine-scoped owner
        # home (~/.hermes incl. the committed dependency state every
        # throwaway HERMES_HOME templates) and ~/.local/bin/hermes.
        run: |
          if [ "${{ matrix.agent }}" = "opencode" ]; then
            npm install -g --no-audit --no-fund opencode-ai@1.19.0
          elif [ "${{ matrix.agent }}" = "codex" ]; then
            npm install -g --no-audit --no-fund @openai/codex@0.162.1
          else
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-browser --skip-computer-use --commit bf0203a794a07aac3ff764972ab9087baa4e4f4e
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: hermes driver guard (pre-budget)
        # The driver's own guard tests, before the leg spends LLM budget: a
        # red here is a driver break (config surgery, installs template),
        # not a case failure. Runs from source — the driver imports node
        # builtins and repo .ts only, so no build and no module mocks.
        if: matrix.agent == 'hermes'
        run: node --test test/e2e-driver-hermes.test.ts
      - name: Run agent-level E2E suite (${{ matrix.agent }})
        # The staged gate's budget control point — the ONLY step that
        # spends LLM budget, so this is the one if that must never be
        # dropped when hermes is promoted (the pin in
        # structure-adopted.test.ts names it).
        if: matrix.agent != 'hermes' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          E2E_ENABLE: '1'
          E2E_AGENT: ${{ matrix.agent }}
          E2E_APIKEY: ${{ secrets.E2E_TEST_MODEL_APIKEY }}
          E2E_PROVIDER_ID: ${{ vars.E2E_TEST_PROVIDER_ID || 'opengw' }}
          E2E_PROVIDER_BASEURL: ${{ vars.E2E_TEST_PROVIDER_BASEURL || 'https://opengw.clouddeveloper.club/v1' }}
          E2E_MODEL: ${{ vars.E2E_TEST_MODEL || 'glm-5.2' }}
        # Every lane resolves to a ref that carries the suite (v2 is the
        # suite's bloodline; PR merge refs sit on it) — a missing test:e2e
        # here means someone broke it, so fail loud instead of a green
        # no-op. The driver echo grep makes an E2E_AGENT wiring miss fail
        # loud too: without it, a miss silently runs this leg as a green
        # duplicate of the other driver.
        run: |
          grep -q '"test:e2e"' package.json || { echo "::error::test:e2e is not defined on the checked-out ref — the E2E lanes require the suite."; exit 1; }
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-run.log
          grep -q "\[runner\] driver ${{ matrix.agent }}" e2e-run.log || { echo "::error::driver wiring miss — the ${{ matrix.agent }} leg did not run the ${{ matrix.agent }} driver"; exit 1; }
      - name: Upload E2E report (${{ matrix.agent }})
        if: always() && (matrix.agent != 'hermes' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.agent }}
          path: .e2e-results/
          # .e2e-results is a dot-directory; upload-artifact >= 4.4.0
          # excludes hidden paths by default, which silently ate the
          # suite's report (the "report that always ships" contract).
          # Safe because the runner scrubs the whole serialized report
          # with scrubSecrets before it is ever written.
          include-hidden-files: true
          retention-days: 30

  # Real-agent lifecycle lane, moved from ci.yml (the plain PR gate never
  # installs agent CLIs — agent-CLI-dependent coverage lives where the
  # CLIs are): installs the actual opencode/codex CLIs and drives them
  # through install -> agent-visible state -> uninstall inside sandboxed
  # config dirs (the test skips itself unless DEVKIT_REAL_AGENT_TESTS is
  # set, so an operator firing this workflow without the env never pays
  # the lane's cost). The CLIs are exact-pinned because the test asserts
  # agent output contracts (mcp list rendering, plugin list --json shape)
  # verified against these versions — bump a pin only together with a
  # green run of DEVKIT_REAL_AGENT_TESTS=1 node --test
  # test/real-agents.test.ts, and in lockstep with the e2e matrix install
  # step above (a two-place event within this file, pinned by
  # structure-adopted.test.ts). No needs: gate is carried from ci.yml —
  # this workflow has no test job, and a dangling one would fail the
  # whole file at validation.
  real-agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' ||
      ((github.event.action == 'synchronize' || github.event.label.name == 'run-e2e') &&
      contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('real-agents-pr-{0}', github.event.pull_request.number) || 'real-agents-trunk' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same ref policy as the e2e job: trunk lanes test v2 (the
          # suite's bloodline), push and PR lanes test the triggering ref.
          ref: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || 'v2' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: install agent CLIs (exact-pinned)
        run: npm install -g --no-audit --no-fund opencode-ai@1.19.0 @openai/codex@0.162.1
      - run: node --test test/real-agents.test.ts
        env:
          DEVKIT_REAL_AGENT_TESTS: '1'
