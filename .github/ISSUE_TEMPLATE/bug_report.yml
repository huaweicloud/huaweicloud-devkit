name: Bug Report
description: Report a problem with Huawei Cloud DevKit
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Version
      description: Plugin version (npm package version or commit)
      placeholder: 'e.g. 0.1.23'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and agent (Codex / OpenCode / Claude Code / Cursor / CodeArts / CodeArts Work / WorkBuddy / DSH)
      placeholder: 'e.g. Windows 11, Codex 0.4'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Relevant logs, error messages, or screenshots.
    validations:
      required: false
