name: Feature Request
description: Suggest a new capability or improvement for Huawei Cloud DevKit
title: '[Feature]: '
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the problem you are trying to solve.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Use case
      description: What are you trying to achieve? Why is the current plugin not sufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the plugin do differently or add?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you have tried.
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to help implement this?
      options:
        - label: I can contribute this feature
